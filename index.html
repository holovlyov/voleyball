const zx=z=>[3,3,0,-3,-3,0][z-1];
function dfn(zs,dX,n,sy){
 const out=[],fx=[];
 zs.forEach((z,i)=>{if(z>1&&z<5)fx.push(i)});
 fx.sort((a,b)=>Math.abs(zx(zs[a])-dX)-Math.abs(zx(zs[b])-dX));
 fx.slice(0,n).sort((a,b)=>zx(zs[a])-zx(zs[b])).forEach((i,k)=>out[i]={x:cl(dX+(k-(n-1)/2)*.95,4.2),z:.55,j:.45,a:1});
 fx.slice(n).forEach(i=>out[i]={x:zx(zs[i])*.9,z:3,j:0,a:0});
 zs.forEach((z,i)=>{if(out[i])return;const c=z===5?-1:z===1?1:0,s=c*dX;let x=c*3.4+dX*.12,d=c?5.4:7.4;

function build(){
 const o=ORD[S.sys],ph=S.ph,rc=S.rec,r=S.rot,zs=o.map((n,i)=>((i-r)%6+6)%6+1),st=i=>i===0||(S.sys==='s4'&&i===3);

 const pick=pf=>{for(const q of pf){const i=zs.indexOf(q);if(i>=0&&!st(i))return i}return zs.findIndex((z,i)=>!st(i))};
 let O=mk(k1,1),P=mk(k2,-1);const A=AK[S.ak],ai=pick(A[1]),bk=A[3]>3,dX=DX[S.dr],dbk=S.dr==='p'||S.dr==='b';

 if(/^(att|set|atk|cov)$/.test(ph)){const a=O[ai],ax=A[2];

  if(ph==='cov'){const C=[-2.4,-1.2,0,1.2,2.4].map((d,k)=>[cl(ax+d,4.2),[2.8,4.4,5.8,4.4,2.8][k]]);
   O.map((p,i)=>i).filter(i=>i!==ai).sort((u,v)=>O[u].x-O[v].x).forEach((i,k)=>{O[i].x=C[k][0];O[i].z=C[k][1]});a.x=ax;a.z=A[3]+.7}
  P=dfn(zs,-ax,S.bl,S.ds).map(q=>({x:-q.x,z:-q.z,j:q.j,a:q.a}))}
 if(ph==='def'){O=dfn(zs,dX,S.bl,S.ds);P[pick(DZ[S.dr])]={x:dX,z:-(dbk?3.8:.6),j:.65,a:1}}
 const B={start:rc?[-3,1.2,-10.4,0]:[3,1.2,10.4,0],serve:rc?[0,1,6.5,3.5]:[0,1,-6.5,3.5],game:rc?[3.1,2.6,.8,2]:[-3.1,2.6,-.8,2],att:[3.1,2.4,.8,2],set:[A[2],A[4],A[3],2.5],atk:[A[2],A[4],A[3],.4],cov:[A[2],2.9,-.8,1.5],def:[dX,3.2,-(dbk?3.8:.6),2.5]};
 return{o:O,p:P,b:B[ph]}}

add(new THREE.PlaneGeometry(30,42),M('#27405a'),0,-.02,0,FL);

[[9.1,.1,0,9],[9.1,.1,0,-9],[.1,18.1,-4.5,0],[.1,18.1,4.5,0],[9,.08,0,0],[9,.05,0,3],[9,.05,0,-3]].forEach(a=>add(new THREE.PlaneGeometry(a[0],a[1]),M('#fff'),a[2],.01,a[3],FL));

const hl=bm(new THREE.PlaneGeometry(9,9),0x3b82f6,.2),ring=bm(new THREE.RingGeometry(.3,.45,24),0xffffff,.95),pole=bm(new THREE.CylinderGeometry(.02,.02,1),0xffffff,.8);
hl.rotation.x=FL;ring.rotation.x=FL;
const zg=new THREE.Group();sc.add(zg);
[[3,7.5],[3,1.5],[0,1.5],[-3,1.5],[-3,7.5],[0,7.5]].forEach((p,i)=>{
 const m=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({map:tex(64,64,g=>{g.fillStyle='rgba(255,255,255,.4)';g.font='bold 52px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(i+1,32,34)}),transparent:true,depthWrite:false}));

 const g=new THREE.Group(),tm=M(opp?'#6b7a8c':'#888'),sk=M('#e0b48c');

 b(new THREE.CylinderGeometry(.14,.12,.8),M('#1b2430'),.4);

 const sp=new THREE.Sprite(new THREE.SpriteMaterial({depthTest:false}));sp.position.y=2.4;sp.scale.set(1.2,.6,1);g.add(sp);
 if(opp){g.rotation.y=Math.PI;sp.visible=false}
 sc.add(g);return{g,tm,hd,arms,sp,x:0,z:5,j:0,a:0}}
const our=[0,1,2,3,4,5].map(()=>mk(0)),opp=[0,1,2,3,4,5].map(()=>mk(1));
const ball=add(new THREE.SphereGeometry(.24,16,12),new THREE.MeshLambertMaterial({map:tex(128,64,g=>{g.fillStyle='#f2c230';g.fillRect(0,0,128,64);g.fillStyle='#2f6fd6';g.fillRect(0,20,128,24)})}),0,3,0);
const tp=[],tg=new THREE.BufferGeometry(),tln=new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xffffff}));tln.frustumCulled=false;sc.add(tln);

let bf=[0,3,0],bto=[0,3,0],arc=0,bT=1;
function setBall(){const t=F.b;bf=ball.position.toArray();bto=t.slice(0,3);arc=t[3]||0;bT=0}
function reset(){S.mode='auto';F=build();setBall()}

function go(d){
 if(S.mode==='my'&&SC.length){S.si=(S.si+d+SC.length)%SC.length;load();return}
 let i=SEQ.indexOf(S.ph)+d;if(i>=8){i=0;S.rot=(S.rot+1)%6}if(i<0)i=7;
 S.ph=SEQ[i];reset();ui()}
function nq(){S.rot=rnd(6);S.rec=rnd(2);S.ph=SEQ[rnd(8)];S.ak=Object.keys(AK)[rnd(6)];S.dr='lcrpb'[rnd(5)];S.bl=1+rnd(3);S.mode='auto';F=build();

function ui(){
 const B=(k,v,t,on)=>`<button class="b${on?' on':''}" data-k="${k}" data-v="${v}">${t}</button>`;

 const G=(t,h)=>`<h3>${t}</h3><div>${h}</div>`,L=(k,a)=>a.map(x=>B(k,x[0],x[1],S[k]===x[0])).join('');
 const tn=S.fmt==='tr',v=eff(),ph=S.ph,at=/^(att|set|atk|cov)$/.test(ph);let h='';

  if(at||ph==='def')h+=G(at?'Блок суперника':'Наш блок',L('bl',[[1,'Одиночний'],[2,'Подвійний'],[3,'Потрійний']]))+G(at?'Захист суперника':'Система захисту',L('ds',[['per','Периметр'],['rot','Ротація'],['man','Man-up']]));
  h+=G('Ротація (де стоїть зв’язуючий)',[0,1,2,3,4,5].map(i=>B('rot',i,`<b>${i+1}</b><br><small>зона ${SZ[i]}</small>`,S.rot===i)).join(''));
  h+=G('Хто починає розіграш',B('rec',0,'Ми подаємо',!S.rec)+B('rec',1,'Ми приймаємо',S.rec));
  h+=G('Висота м’яча',[[.25,'На землі'],[1,'Низько'],[2.6,'Пас'],[3.2,'Удар']].map(a=>B('by',a[0],a[1],Math.abs(F.b[1]-a[0])<.15)).join(''));
  h+=G('Мій сценарій (кроки)',SC.map((s,i)=>B('si',i,i+1,S.mode==='my'&&S.si===i)).join('')+B('add',0,'＋ Крок')+(S.mode==='my'?B('upd',0,'Оновити')+B('del',0,'🗑')+B('auto',0,'Авто'):''))}
 h+=G('Система',L('sys',[['s5','5-1'],['s4','4-2']]))+G('Формат',L('fmt',[['half','Пів поля'],['full','Ціле поле'],['tr','Тренажер']]));
 if(v==='p1'||v==='p3')h+=G('Гравець',ORD[S.sys].map((n,i)=>B('sel',i,n,S.sel===i)).join(''));
 h+=G('Опції',Tg('lib','Ліберо')+Tg('zn','Номери зон')+Tg('dg','Діагоналі')+Tg('lab','Підписи')+(tn?'':Tg('tj','Слід м’яча')+`<select>${[[40,'Короткий слід'],[160,'Довгий слід'],[400,'Дуже довгий']].map(a=>`<option value="${a[0]}"${S.tl===a[0]?' selected':''}>${a[1]}</option>`).join('')}</select>`+B('clr',0,'Стерти слід')));

 const ctx=`Ротація ${S.rot+1} · ${S.rec?'Ми приймаємо':'Ми подаємо'} · ${S.mode==='my'?`Мій сценарій, крок ${S.si+1}/${SC.length}`:PH[ph]+(at?' · '+AK[S.ak][0]:ph==='def'?' · атака: '+{l:'ліво',c:'центр',r:'право',p:'пайп',b:'задня'}[S.dr]:'')}`;
 $('#h1').textContent=tn&&Q?(Q.done?Q.msg:`Де стоїть «${NM[Q.i]}»? Торкніться майданчика. ${ctx}`):ctx}
const H=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,v=b.dataset.v,t=b.dataset.t;
 if(t){S[t]=S[t]?0:1;if(t==='lib')reset();ui();return}
 if(k==='clr'){tp.length=0;return}

 if(k==='play'){S.play=S.play?0:1;acc=0;ui();return}
 if(k==='spd'){S.spd=S.spd===1?2:S.spd===2?.5:1;ui();return}
 if(k==='step'){go(+v);return}
 if(k==='add'){const n=S.mode==='my'?S.si+1:SC.length;SC.splice(n,0,cp(F));S.si=n;S.mode='my';ui();return}
